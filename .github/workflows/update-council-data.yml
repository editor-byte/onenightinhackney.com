name: Update council data

# Refreshes data/council.json (the map's backup copy of Hackney Council data)
# every Monday morning, and whenever you press "Run workflow" on the Actions tab.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-council-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch council data (keeps last good copy of any layer that fails the safety check)
        run: python scripts/update_council_data.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/council.json
          if git diff --staged --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update council data ($(date -u +%Y-%m-%d))"
            git push
          fi
